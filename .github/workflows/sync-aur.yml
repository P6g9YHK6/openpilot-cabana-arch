name: Sync AUR package

on:
  push:
    branches:
      - main
    paths:
      - 'aur/**'
  workflow_call:
    secrets:
      AUR_SSH_KEY:
        required: true
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'P6g9YHK6/openpilot-cabana-arch'
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:base-devel
      options: --user root
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm git sudo ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          cp -r aur /home/builder/pkg
          chown -R builder:builder /home/builder/pkg

      - name: Check .SRCINFO is current
        working-directory: /home/builder/pkg
        run: sudo -u builder makepkg --printsrcinfo | diff - .SRCINFO

      - name: Build package
        working-directory: /home/builder/pkg
        run: sudo -u builder env HOME=/home/builder makepkg -s --noconfirm

      - name: Install package
        run: |
          pacman -S --noconfirm --needed mesa xorg-server-xvfb xorg-xauth
          pacman -U --noconfirm /home/builder/pkg/openpilot-cabana-*.pkg.tar.zst

      # A package that builds can still fail at runtime, so run it before publishing.
      - name: Test installed package
        working-directory: /home/builder
        run: |
          sudo -u builder env HOME=/home/builder bash -euo pipefail <<'EOF'
          eval "$(grep -E '^(root=|export )' /usr/bin/cabana)"
          [[ $(command -v python3) == "$root/.venv/bin/python3" ]]
          python3 --version

          if ldd "$root/openpilot/tools/cabana/cabana" | grep 'not found'; then
            exit 1
          fi

          # Asset paths compiled into the binary by prepare().
          test -d "$root/opendbc_repo/opendbc/dbc"
          test -d "$root/openpilot/selfdrive/assets/fonts"
          test -f "$root/.venv/lib/python3.12/site-packages/bootstrap_icons/install/bootstrap-icons.ttf"

          # Python entry points the binary calls at runtime.
          cabana --help > /dev/null
          python3 "$root/openpilot/system/webrtc/bridge.py" --help > /dev/null
          python3 "$root/openpilot/tools/lib/auth.py" --help > /dev/null
          python3 -m openpilot.tools.lib.file_downloader --help > /dev/null
          python3 -c 'import openpilot.selfdrive.test.process_replay.migration, openpilot.tools.lib.logreader'

          # Still running when the timeout ends it means the UI started.
          status=0
          timeout -s INT 15 xvfb-run -a cabana --no-vipc || status=$?
          [[ $status == 124 ]]
          EOF

  publish:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:base-devel
      options: --user root
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm git openssh rsync ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "$AUR_SSH_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new -i $HOME/.ssh/aur"

          source_sha=$(git -c safe.directory="*" rev-parse --short HEAD)
          git clone aur@aur.archlinux.org:openpilot-cabana.git /tmp/aur-sync
          rsync -a --delete --exclude=.git aur/ /tmp/aur-sync/
          cd /tmp/aur-sync
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "AUR already up to date"
            exit 0
          fi
          git commit -m "Update from openpilot-cabana-arch@$source_sha"
          git push origin HEAD:master
