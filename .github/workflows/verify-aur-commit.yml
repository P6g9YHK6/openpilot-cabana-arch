name: Verify AUR Commit

on:
  workflow_run:
    workflows: ["Sync AUR package"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify:
    if: >
      github.repository == 'P6g9YHK6/openpilot-cabana-arch'
      && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Compare AUR and repository commits
        run: |
          aur=$(curl -fsSL "https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=openpilot-cabana" | grep -oP "^_commit=\K[a-f0-9]{40}")
          repo=$(grep -oP "^_commit=\K[a-f0-9]{40}" aur/PKGBUILD)
          echo "AUR:  $aur"
          echo "Repo: $repo"
          [ "$aur" = "$repo" ]
