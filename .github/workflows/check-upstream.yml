name: Check upstream

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    if: github.repository == 'P6g9YHK6/openpilot-cabana-arch'
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:base-devel
      options: --user root
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm git jq sudo ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # openpilot moves fast, so only bump when Cabana itself changes.
      - name: Update PKGBUILD to the latest Cabana commit
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          latest=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/commaai/openpilot/commits?path=openpilot/tools/cabana&per_page=1")
          sha=$(jq -er '.[0].sha' <<< "$latest")
          date=$(jq -er '.[0].commit.committer.date[:10]' <<< "$latest" | tr -d -)
          current=$(grep -oP '^_commit=\K[a-f0-9]{40}' aur/PKGBUILD)
          if [ "$sha" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -i -e "s/^_commit=.*/_commit=$sha/" \
                 -e "s/^pkgver=.*/pkgver=2.0.$date.g${sha:0:10}/" \
                 -e "s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD

          useradd -m builder
          cp -r aur /home/builder/pkg
          chown -R builder:builder /home/builder/pkg
          (cd /home/builder/pkg && sudo -u builder makepkg --printsrcinfo) > aur/.SRCINFO

          git config user.name "openpilot-cabana-bot"
          git config user.email "bot@openpilot-cabana"
          git add aur/PKGBUILD aur/.SRCINFO
          git commit -m "Update Cabana to commaai/openpilot@${sha:0:10}"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN do not trigger workflows, so call the sync directly.
  sync:
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    uses: ./.github/workflows/sync-aur.yml
    secrets:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
